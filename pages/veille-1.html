<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuites d'informations | Veille 1</title>
  <link rel="icon" href="../assets/images/profile/profile.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="../assets/images/profile/profile.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <nav>
        <a href="../index.html#projets">Projets</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
      <a class="back-link" href="../index.html">Retour</a>
    </div>
  </header>

  <main class="page slides-page">
    <section class="ppt" aria-label="Diaporama veille 1">
      <button class="ppt-btn ppt-prev" type="button" aria-label="Diapositive précédente">←</button>
      <button class="ppt-btn ppt-next" type="button" aria-label="Diapositive suivante">→</button>
      <img class="ppt-slide" id="ppt-slide" src="../assets/images/veille-1/home.jpg" alt="Diapositive">
    </section>
  </main>

  <script>
    (() => {
      const img = document.getElementById("ppt-slide");
      const nextBtn = document.querySelector(".ppt-next");
      const prevBtn = document.querySelector(".ppt-prev");
      const base = "../assets/images/veille-1/slides/slide-";
      const ext = ".jpg";
      const maxSlides = 50;
      const fallback = "../assets/images/veille-1/home.jpg";

      const pad2 = (n) => String(n).padStart(2, "0");
      const srcFor = (n) => {
        if (n === 1) {
          return "../assets/images/veille-1/home.jpg";
        }
        if (n === 2) {
          return "../assets/images/veille-1/home2.jpg";
        }
        return `${base}${pad2(n - 2)}${ext}`;
      };

      const parseStart = () => {
        const hash = window.location.hash.replace("#", "");
        const asNumber = Number.parseInt(hash, 10);
        return Number.isFinite(asNumber) && asNumber > 0 ? asNumber : 1;
      };

      const tryLoad = (url) =>
        new Promise((resolve) => {
          const probe = new Image();
          const timer = window.setTimeout(() => {
            probe.src = "";
            resolve(false);
          }, 600);
          probe.onload = () => {
            window.clearTimeout(timer);
            resolve(true);
          };
          probe.onerror = () => {
            window.clearTimeout(timer);
            resolve(false);
          };
          probe.src = url;
        });

      let current = parseStart();

      const show = (n) => {
        current = n;
        window.location.hash = String(n);
        img.src = srcFor(n);
      };

      const findAndShow = async (direction) => {
        for (let i = 0; i < maxSlides; i += 1) {
          const candidate = ((current - 1 + direction * (i + 1)) % maxSlides + maxSlides) % maxSlides + 1;
          const url = srcFor(candidate);
          const ok = await tryLoad(url);
          if (ok) {
            show(candidate);
            return;
          }
        }
        img.src = fallback;
      };

      img.addEventListener("click", () => {
        void findAndShow(1);
      });

      nextBtn.addEventListener("click", () => {
        void findAndShow(1);
      });

      prevBtn.addEventListener("click", () => {
        void findAndShow(-1);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === " " || event.code === "Space" || event.key === "ArrowRight" || event.key === "PageDown") {
          event.preventDefault();
          void findAndShow(1);
          return;
        }
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          void findAndShow(-1);
        }
      });

      img.addEventListener("error", () => {
        img.src = fallback;
      });

      void (async () => {
        const startUrl = srcFor(current);
        const ok = await tryLoad(startUrl);
        if (ok) {
          show(current);
          return;
        }
        img.src = fallback;
      })();
    })();
  </script>
</body>
</html>
