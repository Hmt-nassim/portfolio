<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA générative & autonomie | Veille 2</title>
  <link rel="icon" href="../assets/images/profile/profile.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="../assets/images/profile/profile.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="header">
    <div class="container nav">
      <nav>
        <a href="../index.html#projets">Projets</a>
        <a href="../index.html#contact">Contact</a>
      </nav>
      <a class="back-link" href="../index.html#veille">Retour</a>
    </div>
  </header>

  <main class="page slides-page">
    <section class="ppt" aria-label="Diaporama veille 2">
      <button class="ppt-btn ppt-prev" type="button" aria-label="Diapositive précédente">←</button>
      <button class="ppt-btn ppt-next" type="button" aria-label="Diapositive suivante">→</button>
      <img class="ppt-slide" id="ppt-slide" src="../assets/images/veille-2/1.png" alt="Diapositive">
    </section>
  </main>

  <script>
    (() => {
      const slideImage = document.getElementById("ppt-slide");
      const nextButton = document.querySelector(".ppt-next");
      const prevButton = document.querySelector(".ppt-prev");

      const SLIDE_FOLDER = "../assets/images/veille-2/";
      const SLIDE_COUNT = 6;
      const FALLBACK_URL = `${SLIDE_FOLDER}1.png`;

      const getSlideUrl = (index) => `${SLIDE_FOLDER}${index}.png`;

      const getStartIndexFromHash = () => {
        const hashValue = window.location.hash.replace("#", "");
        const parsed = Number.parseInt(hashValue, 10);
        if (!Number.isFinite(parsed) || parsed <= 0) return 1;
        return Math.min(parsed, SLIDE_COUNT);
      };

      const urlExists = (url) =>
        new Promise((resolve) => {
          const probe = new Image();
          const timer = window.setTimeout(() => {
            probe.src = "";
            resolve(false);
          }, 600);
          probe.onload = () => {
            window.clearTimeout(timer);
            resolve(true);
          };
          probe.onerror = () => {
            window.clearTimeout(timer);
            resolve(false);
          };
          probe.src = url;
        });

      let currentIndex = getStartIndexFromHash();

      const setSlide = (index) => {
        currentIndex = index;
        window.location.hash = String(index);
        slideImage.src = getSlideUrl(index);
      };

      const go = async (delta) => {
        for (let step = 1; step <= SLIDE_COUNT; step += 1) {
          const candidate =
            ((currentIndex - 1 + delta * step) % SLIDE_COUNT + SLIDE_COUNT) % SLIDE_COUNT + 1;
          const url = getSlideUrl(candidate);
          const ok = await urlExists(url);
          if (ok) {
            setSlide(candidate);
            return;
          }
        }
        slideImage.src = FALLBACK_URL;
      };

      slideImage.addEventListener("click", () => {
        void go(1);
      });

      nextButton.addEventListener("click", () => {
        void go(1);
      });

      prevButton.addEventListener("click", () => {
        void go(-1);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === " " || event.code === "Space" || event.key === "ArrowRight" || event.key === "PageDown") {
          event.preventDefault();
          void go(1);
          return;
        }
        if (event.key === "ArrowLeft" || event.key === "PageUp") {
          event.preventDefault();
          void go(-1);
        }
      });

      slideImage.addEventListener("error", () => {
        slideImage.src = FALLBACK_URL;
      });

      void (async () => {
        const ok = await urlExists(getSlideUrl(currentIndex));
        if (ok) {
          setSlide(currentIndex);
          return;
        }
        slideImage.src = FALLBACK_URL;
      })();
    })();
  </script>
</body>
</html>
